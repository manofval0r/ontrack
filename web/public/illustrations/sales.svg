<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" role="img" aria-label="Salespeople goal tracking illustration">
  <!-- Floor shadow -->
  <ellipse cx="200" cy="215" rx="160" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Left: Analytics Growth Graph Card -->
  <g transform="translate(50, 45)">
    <!-- Shadow -->
    <rect x="5" y="5" width="165" height="135" rx="16" fill="#071E2D" opacity="0.12"/>
    <rect x="0" y="0" width="165" height="135" rx="16" fill="#FFFFFF" stroke="#071E2D" stroke-width="2.5"/>

    <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#071E2D">WEEKLY PIPELINE</text>
    
    <!-- Growth rate pill -->
    <rect x="110" y="12" width="42" height="16" rx="8" fill="#E6F7F5" stroke="#00C4B3" stroke-width="1"/>
    <text x="116" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#006D6A">+24%</text>

    <!-- Upward Trend Line & Area -->
    <g transform="translate(16, 38)">
      <!-- Background grid lines -->
      <line x1="0" y1="20" x2="133" y2="20" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="0" y1="45" x2="133" y2="45" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="0" y1="70" x2="133" y2="70" stroke="#071E2D" stroke-width="1.5"/>

      <!-- Gradient area under curve -->
      <path d="M0 65 Q 35 55, 60 40 T 115 15 L 130 8 L 130 70 L 0 70 Z" fill="#E6F7F5" opacity="0.8"/>
      <!-- Growth Curve -->
      <path d="M0 65 Q 35 55, 60 40 T 115 15 L 130 8" stroke="#00C4B3" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <!-- Data dots -->
      <circle cx="35" cy="56" r="3.5" fill="#FFFFFF" stroke="#071E2D" stroke-width="2"/>
      <circle cx="75" cy="35" r="3.5" fill="#FFFFFF" stroke="#071E2D" stroke-width="2"/>
      <circle cx="115" cy="15" r="3.5" fill="#FFFFFF" stroke="#071E2D" stroke-width="2"/>
      <circle cx="130" cy="8" r="5" fill="#00C4B3" stroke="#071E2D" stroke-width="2"/>
    </g>

    <text x="16" y="124" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#071E2D" opacity="0.6">Updated live via chat</text>
  </g>

  <!-- Right: Deals Won Counter Badge -->
  <g transform="translate(205, 50)">
    <!-- Shadow -->
    <rect x="5" y="5" width="145" height="120" rx="16" fill="#071E2D" opacity="0.12"/>
    <rect x="0" y="0" width="145" height="120" rx="16" fill="#071E2D"/>

    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#A7E8DF">DEALS CLOSED</text>
    
    <text x="16" y="66" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="34" fill="#FFFFFF">4 <tspan font-size="18" fill="#A7E8DF">/ 5</tspan></text>

    <!-- Progress pill -->
    <g transform="translate(16, 80)">
      <rect x="0" y="0" width="113" height="24" rx="12" fill="#1E293B" stroke="#00C4B3" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="5" fill="#00C4B3"/>
      <text x="24" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#00C4B3">1 Deal To Goal</text>
    </g>
  </g>

  <!-- Floating "+1" pill -->
  <g transform="translate(182, 30)">
    <rect x="0" y="0" width="46" height="24" rx="12" fill="#00C4B3" stroke="#071E2D" stroke-width="2"/>
    <text x="23" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#071E2D" text-anchor="middle">+1 Deal</text>
  </g>

  <!-- Ambient accents -->
  <circle cx="36" cy="115" r="3" fill="#00C4B3"/>
  <circle cx="365" cy="85" r="4" fill="#006D6A"/>
</svg>
