<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" role="img" aria-label="Students goal tracking illustration">
  <!-- Floor shadow -->
  <ellipse cx="200" cy="215" rx="160" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Stack of Books -->
  <g transform="translate(60, 95)">
    <!-- Bottom Book (Navy) -->
    <rect x="0" y="55" width="160" height="24" rx="4" fill="#071E2D" stroke="#071E2D" stroke-width="2"/>
    <rect x="10" y="60" width="140" height="14" rx="2" fill="#FFFFFF"/>
    <rect x="14" y="63" width="130" height="3" fill="#E2E8F0"/>
    <rect x="14" y="68" width="110" height="3" fill="#E2E8F0"/>

    <!-- Middle Book (Turquoise) -->
    <rect x="15" y="28" width="140" height="22" rx="4" fill="#00C4B3" stroke="#071E2D" stroke-width="2"/>
    <rect x="25" y="33" width="120" height="12" rx="2" fill="#FFFFFF"/>
    <!-- Bookmark ribbon -->
    <path d="M120 28 L120 54 L126 48 L132 54 L132 28 Z" fill="#006D6A"/>

    <!-- Top Book (White/Mint) -->
    <rect x="25" y="2" width="125" height="22" rx="4" fill="#FFFFFF" stroke="#071E2D" stroke-width="2"/>
    <rect x="35" y="7" width="105" height="12" rx="2" fill="#E6F7F5"/>
  </g>

  <!-- Graduation Cap (floating above books) -->
  <g transform="translate(100, 36)">
    <!-- Mortarboard Diamond -->
    <polygon points="45,0 90,14 45,28 0,14" fill="#071E2D" stroke="#071E2D" stroke-width="1.5"/>
    <polygon points="45,4 82,14 45,24 8,14" fill="#1E293B"/>
    <!-- Cap skull base -->
    <path d="M22 21 L22 36 C22 44 68 44 68 36 L68 21" fill="#071E2D" stroke="#071E2D" stroke-width="1.5"/>
    <!-- Tassel -->
    <circle cx="45" cy="14" r="3" fill="#00C4B3"/>
    <path d="M45 14 C58 16 68 24 70 34" stroke="#00C4B3" stroke-width="2" fill="none"/>
    <circle cx="71" cy="36" r="3" fill="#00C4B3"/>
  </g>

  <!-- Reading Goal Target Card (Right Side) -->
  <g transform="translate(210, 48)">
    <!-- Shadow -->
    <rect x="5" y="5" width="145" height="125" rx="16" fill="#071E2D" opacity="0.12"/>
    <rect x="0" y="0" width="145" height="125" rx="16" fill="#FFFFFF" stroke="#071E2D" stroke-width="2.5"/>

    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#071E2D">READING TARGET</text>
    <rect x="16" y="36" width="113" height="1" fill="#E2E8F0"/>

    <text x="16" y="58" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="17" fill="#071E2D">2 of 4 Books</text>
    <text x="16" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" fill="#006D6A">Ahead of midterm schedule</text>

    <!-- Progress bar -->
    <rect x="16" y="90" width="113" height="8" rx="4" fill="#F1F5F9" stroke="#071E2D" stroke-width="1"/>
    <rect x="16" y="90" width="80" height="8" rx="4" fill="#00C4B3"/>

    <text x="16" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#071E2D">Next: Chapter 5 due Friday</text>
  </g>

  <!-- Decorative sparkles -->
  <path d="M50 70 L52 75 L57 77 L52 79 L50 84 L48 79 L43 77 L48 75 Z" fill="#00C4B3"/>
  <circle cx="365" cy="115" r="3" fill="#006D6A"/>
</svg>
