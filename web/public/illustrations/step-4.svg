<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" role="img" aria-label="Get checked on illustration">
  <!-- Floor shadow -->
  <ellipse cx="200" cy="215" rx="160" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Calendar card in background (Deadline milestone) -->
  <g transform="translate(65, 45)">
    <rect x="5" y="5" width="130" height="135" rx="16" fill="#071E2D" opacity="0.12"/>
    <rect x="0" y="0" width="130" height="135" rx="16" fill="#FFFFFF" stroke="#071E2D" stroke-width="2.5"/>
    
    <!-- Red/Navy header for calendar -->
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#071E2D"/>
    <rect x="0" y="16" width="130" height="16" fill="#071E2D"/>
    <text x="65" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">FRIDAY DEADLINE</text>
    
    <!-- Big Date 18 -->
    <text x="65" y="76" font-family="'Fraunces', Georgia, serif" font-weight="800" font-size="34" fill="#071E2D" text-anchor="middle">18</text>
    <text x="65" y="96" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#006D6A" text-anchor="middle">TARGET REACHED</text>
    
    <!-- Mini progress line -->
    <rect x="20" y="108" width="90" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="20" y="108" width="90" height="8" rx="4" fill="#00C4B3"/>
  </g>

  <!-- Big Floating Verdict Stamp / Badge -->
  <g transform="translate(195, 52)">
    <!-- Shadow -->
    <rect x="6" y="6" width="155" height="120" rx="20" fill="#071E2D" opacity="0.15"/>
    <!-- Card Frame -->
    <rect x="0" y="0" width="155" height="120" rx="20" fill="#FFFFFF" stroke="#071E2D" stroke-width="2.5"/>

    <!-- Verdict Pill Stamp -->
    <g transform="translate(14, 18)">
      <rect x="0" y="0" width="126" height="42" rx="12" fill="#E6F7F5" stroke="#00C4B3" stroke-width="2"/>
      <circle cx="22" cy="21" r="10" fill="#00C4B3"/>
      <path d="M17 21 L20.5 24.5 L27 18" stroke="#071E2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#071E2D">ON TRACK</text>
    </g>

    <!-- Verdict details -->
    <text x="16" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#071E2D">Verdict: 100% Met</text>
    <text x="16" y="96" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="9.5" fill="#071E2D" opacity="0.6">Automated check-in complete</text>
  </g>

  <!-- Floating Star Badge -->
  <g transform="translate(170, 24)">
    <circle cx="16" cy="16" r="16" fill="#00C4B3" stroke="#071E2D" stroke-width="2"/>
    <text x="16" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#071E2D" text-anchor="middle">★</text>
  </g>

  <!-- Decorative sparkles -->
  <path d="M48 90 L50 94 L54 96 L50 98 L48 102 L46 98 L42 96 L46 94 Z" fill="#00C4B3"/>
  <circle cx="360" cy="140" r="3.5" fill="#006D6A"/>
</svg>
