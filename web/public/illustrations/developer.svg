<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" role="img" aria-label="Developers goal tracking illustration">
  <!-- Floor shadow -->
  <ellipse cx="200" cy="215" rx="160" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Left: Code / Terminal Window -->
  <g transform="translate(50, 45)">
    <!-- Shadow -->
    <rect x="5" y="5" width="165" height="135" rx="16" fill="#071E2D" opacity="0.12"/>
    <rect x="0" y="0" width="165" height="135" rx="16" fill="#071E2D" stroke="#071E2D" stroke-width="2"/>

    <!-- Terminal header -->
    <rect x="0" y="0" width="165" height="26" rx="16" fill="#1E293B"/>
    <rect x="0" y="14" width="165" height="12" fill="#1E293B"/>
    <circle cx="14" cy="13" r="3" fill="#00C4B3"/>
    <circle cx="24" cy="13" r="3" fill="#FFE0BD"/>
    <circle cx="34" cy="13" r="3" fill="#FFFFFF" opacity="0.5"/>
    <text x="46" y="16" font-family="monospace" font-size="9" fill="#A7E8DF">terminal: git ship</text>

    <!-- Code & Git terminal output lines -->
    <g transform="translate(14, 38)">
      <text x="0" y="12" font-family="monospace" font-weight="700" font-size="10" fill="#00C4B3">$ ontrack sync --gh</text>
      <text x="0" y="28" font-family="monospace" font-size="9" fill="#FFFFFF">✓ 4 commits logged</text>
      <text x="0" y="42" font-family="monospace" font-size="9" fill="#FFFFFF">✓ PR #42 merged</text>
      <text x="0" y="58" font-family="monospace" font-size="9" fill="#A7E8DF">Streak: 12 days shipped</text>

      <!-- Terminal cursor -->
      <rect x="0" y="70" width="7" height="12" fill="#00C4B3" opacity="0.9"/>
    </g>
  </g>

  <!-- Right: GitHub Branch & Merge PR Card -->
  <g transform="translate(205, 52)">
    <!-- Shadow -->
    <rect x="5" y="5" width="145" height="120" rx="16" fill="#071E2D" opacity="0.12"/>
    <rect x="0" y="0" width="145" height="120" rx="16" fill="#FFFFFF" stroke="#071E2D" stroke-width="2.5"/>

    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#071E2D">GITHUB SYNC</text>

    <!-- Branch diagram -->
    <g transform="translate(16, 36)">
      <!-- Main trunk -->
      <line x1="12" y1="0" x2="12" y2="45" stroke="#071E2D" stroke-width="2.5"/>
      <!-- Feature branch -->
      <path d="M12 10 C 25 10, 35 20, 35 30 L 35 32 C 35 40, 25 45, 14 45" stroke="#00C4B3" stroke-width="2.5" fill="none"/>
      
      <!-- Commit nodes -->
      <circle cx="12" cy="10" r="4.5" fill="#071E2D"/>
      <circle cx="35" cy="28" r="4.5" fill="#00C4B3"/>
      <circle cx="12" cy="45" r="5.5" fill="#006D6A" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- PR Merged chip -->
    <g transform="translate(56, 44)">
      <rect x="0" y="0" width="72" height="22" rx="11" fill="#E6F7F5" stroke="#00C4B3" stroke-width="1.2"/>
      <text x="10" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#006D6A">PR #42 Merged</text>
    </g>

    <text x="14" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#071E2D">Automatic Streak Sync</text>
  </g>

  <!-- Sparkles -->
  <path d="M42 85 L44 89 L48 91 L44 93 L42 97 L40 93 L36 91 L40 89 Z" fill="#00C4B3"/>
  <circle cx="365" cy="100" r="3" fill="#006D6A"/>
</svg>
