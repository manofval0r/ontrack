<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" role="img" aria-label="Your tracker builds itself illustration">
  <!-- Floor shadow -->
  <ellipse cx="200" cy="215" rx="160" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Blueprint grid background pattern -->
  <g opacity="0.25">
    <path d="M70 70 L330 70 M70 110 L330 110 M70 150 L330 150 M70 190 L330 190" stroke="#00C4B3" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M100 50 L100 200 M160 50 L160 200 M220 50 L220 200 M280 50 L280 200" stroke="#00C4B3" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Auto-assembling Tracker Card (Main Center Window) -->
  <g transform="translate(110, 45)">
    <!-- Shadow block -->
    <rect x="6" y="6" width="180" height="135" rx="16" fill="#071E2D" opacity="0.15"/>
    <!-- Card Frame -->
    <rect x="0" y="0" width="180" height="135" rx="16" fill="#FFFFFF" stroke="#071E2D" stroke-width="2.5"/>
    
    <!-- Top Card Bar -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#071E2D"/>
    <!-- Overwrite bottom corner radius of bar -->
    <rect x="0" y="16" width="180" height="16" fill="#071E2D"/>
    <circle cx="16" cy="16" r="3.5" fill="#00C4B3"/>
    <circle cx="28" cy="16" r="3.5" fill="#FFE0BD"/>
    <circle cx="40" cy="16" r="3.5" fill="#FFFFFF" opacity="0.5"/>
    <text x="60" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF">AUTO-BUILDER AI</text>

    <!-- Assembling Widget 1: Counter -->
    <rect x="14" y="44" width="70" height="42" rx="8" fill="#F8FAFB" stroke="#071E2D" stroke-width="1.5"/>
    <text x="22" y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#071E2D">3 / 5</text>
    <rect x="22" y="68" width="54" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="22" y="68" width="34" height="6" rx="3" fill="#00C4B3"/>

    <!-- Assembling Widget 2: Checklist item -->
    <rect x="94" y="44" width="72" height="42" rx="8" fill="#F8FAFB" stroke="#071E2D" stroke-width="1.5"/>
    <rect x="102" y="52" width="10" height="10" rx="3" fill="#00C4B3"/>
    <path d="M104 57 L106 59 L110 54" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="118" y="54" width="40" height="5" rx="2.5" fill="#071E2D" opacity="0.7"/>
    <rect x="102" y="68" width="10" height="10" rx="3" fill="#FFFFFF" stroke="#071E2D" stroke-width="1"/>
    <rect x="118" y="71" width="32" height="5" rx="2.5" fill="#071E2D" opacity="0.3"/>

    <!-- Bottom Action Pill: Built in 0.4s -->
    <rect x="14" y="98" width="152" height="24" rx="12" fill="#E6F7F5" stroke="#00C4B3" stroke-width="1.5"/>
    <circle cx="28" cy="110" r="5" fill="#00C4B3"/>
    <path d="M26 110 L27.5 111.5 L30.5 108.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <text x="38" y="114" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#006D6A">Adaptive Tracker Ready</text>
  </g>

  <!-- Left Floating Gear / Sparkle Block -->
  <g transform="translate(42, 90)">
    <circle cx="28" cy="28" r="24" fill="#E6F7F5" stroke="#071E2D" stroke-width="2"/>
    <path d="M28 14 L31 22 L39 20 L35 28 L42 33 L34 36 L34 44 L28 38 L22 44 L22 36 L14 33 L21 28 L17 20 L25 22 Z" fill="#00C4B3"/>
    <circle cx="28" cy="28" r="7" fill="#FFFFFF" stroke="#071E2D" stroke-width="1.5"/>
  </g>

  <!-- Right Floating Magic Star -->
  <g transform="translate(310, 80)">
    <path d="M24 0 L29 16 L45 21 L31 29 L33 46 L21 34 L7 42 L13 26 L0 18 L16 16 Z" fill="#00C4B3" stroke="#071E2D" stroke-width="2"/>
    <circle cx="22" cy="23" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Small floating sparkle dots -->
  <circle cx="95" cy="50" r="3.5" fill="#00C4B3"/>
  <circle cx="320" cy="170" r="4" fill="#006D6A"/>
  <circle cx="80" cy="180" r="2.5" fill="#071E2D" opacity="0.4"/>
</svg>
